# .github/workflows/update_iptv.yml
name: IPTV 源智能更新与整理

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Create config directory
        run: mkdir -p config data output

      - name: Copy config files if needed
        run: |
          if [ ! -f config/config.yaml ]; then
            cp config/config.yaml.example config/config.yaml 2>/dev/null || echo "No example config"
          fi

      - name: Run update
        run: python -m src.run
        env:
          AUTONOMOUS_MODE: true
          ENABLE_DEMO_FILTER: true
          ENABLE_ALIAS: true
          ENABLE_BLACKLIST: true
          DATABASE_ENABLE: true
          FFMPEG_ENABLE: true
          MAX_WORKERS: 20
          TIMEOUT: 8

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Auto update IPTV list $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          else
            echo "No changes"
          fi
