name: IPTV 源智能更新与整理

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      skip_discover:
        description: '跳过新源发现阶段'
        required: false
        default: false
        type: boolean
      force_refresh:
        description: '强制刷新所有源'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 列出工作目录文件（调试）
        run: ls -la

      - name: 缓存 pip 依赖
        uses: actions/cache@v4
        id: pip-cache
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装 ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 运行 IPTV 采集
        run: python -m src.run
        env:
          AUTONOMOUS_MODE: true
          OPEN_RTMP: false
          ENABLE_DEMO_FILTER: true
          ENABLE_ALIAS: true
          ENABLE_BLACKLIST: true
          DATABASE_ENABLE: true
          FFMPEG_ENABLE: true
          FFMPEG_MODE: deep
          MAX_WORKERS: 20
          TIMEOUT: 8

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ output/ config/ *.m3u *.txt 2>/dev/null || true
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Auto update IPTV list $(date '+%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase || true
            git push origin main
          else
            echo "没有更改，跳过提交"
          fi
